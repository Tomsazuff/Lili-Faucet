<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lili Faucet</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f4f8;
  color:#222;
}

header{
  background:#4930c8;
  color:white;
  text-align:center;
  padding:25px;
}

.card{
  background:white;
  margin:18px;
  padding:20px;
  border-radius:15px;
  box-shadow:0 3px 10px #ddd;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:10px;
  background:#4930c8;
  color:white;
  font-size:16px;
  margin-top:10px;
}

button:disabled{
  background:#aaa;
}

.balance{
  font-size:28px;
  color:#4930c8;
  font-weight:bold;
}

#ptc{
  display:none;
}

.timer{
  font-size:24px;
  font-weight:bold;
  text-align:center;
  margin:15px;
}
</style>
</head>

<body>

<header>
  <h1>💜 Lili Faucet</h1>
  <p>Tvoj osobný crypto dashboard</p>
</header>

<div class="card">
  <h2>💰 Môj zostatok</h2>
  <div class="balance" id="balance">0 satoshi</div>
  <p>Testovací zostatok</p>
</div>

<div class="card">
  <h2>🚀 Služby</h2>

  <button onclick="openPTC()">▶️ PTC</button>
  <button>🧩 Offerwall</button>
  <button>⛏️ Minevo</button>
  <button>🎁 Faucet</button>
</div>

<div class="card" id="ptc">

  <h2>▶️ PTC úloha</h2>

  <p><b>Testovacia úloha</b></p>
  <p>Počkaj 10 sekúnd a potom si môžeš vyzdvihnúť testovaciu odmenu.</p>

  <div class="timer" id="timer">10 sekúnd</div>

  <button id="startBtn" onclick="startPTC()">
    ▶️ Spustiť PTC úlohu
  </button>

  <button id="claimBtn" onclick="claimPTC()" disabled>
    🎁 Získať +1 test satoshi
  </button>

</div>

<div class="card">
  <h2>📜 História</h2>
  <div id="history">Zatiaľ žiadne záznamy.</div>
</div>

<script>

let balance =
  Number(localStorage.getItem("lili_balance")) || 0;

let history =
  localStorage.getItem("lili_history") || "";

const balanceEl =
  document.getElementById("balance");

const historyEl =
  document.getElementById("history");

const ptc =
  document.getElementById("ptc");

const timer =
  document.getElementById("timer");

const startBtn =
  document.getElementById("startBtn");

const claimBtn =
  document.getElementById("claimBtn");

let seconds = 10;
let countdown;

function updateBalance(){
  balanceEl.textContent =
    balance + " satoshi";

  localStorage.setItem(
    "lili_balance",
    balance
  );
}

function updateHistory(){
  historyEl.innerHTML =
    history || "Zatiaľ žiadne záznamy.";

  localStorage.setItem(
    "lili_history",
    history
  );
}

function openPTC(){
  ptc.style.display = "block";
  ptc.scrollIntoView({
    behavior:"smooth"
  });
}

function startPTC(){

  seconds = 10;

  startBtn.disabled = true;
  claimBtn.disabled = true;

  timer.textContent =
    seconds + " sekúnd";

  countdown = setInterval(function(){

    seconds--;

    timer.textContent =
      seconds + " sekúnd";

    if(seconds <= 0){

      clearInterval(countdown);

      timer.textContent =
        "✅ Úloha dokončená";

      claimBtn.disabled = false;

    }

  },1000);
}

function claimPTC(){

  balance += 1;

  updateBalance();

  const date =
    new Date().toLocaleString("sk-SK");

  history =
    "▶️ PTC úloha — +1 test satoshi — " +
    date +
    "<br>" +
    history;

  updateHistory();

  claimBtn.disabled = true;

  startBtn.disabled = false;

  timer.textContent =
    "10 sekúnd";
}

updateBalance();
updateHistory();

</script>

</body>
  </html>
