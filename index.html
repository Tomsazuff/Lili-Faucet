<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lili Faucet</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f4f8;
  color:#222;
}
header{
  background:#6c35d9;
  color:white;
  padding:25px;
  text-align:center;
}
.container{
  max-width:700px;
  margin:auto;
  padding:20px;
}
.card{
  background:white;
  padding:20px;
  margin-bottom:20px;
  border-radius:15px;
  box-shadow:0 2px 8px #ccc;
}
.balance{
  font-size:32px;
  font-weight:bold;
  color:#6c35d9;
}
button{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:0;
  border-radius:10px;
  background:#5630d6;
  color:white;
  font-size:16px;
}
input,select{
  width:100%;
  padding:13px;
  margin-top:8px;
  box-sizing:border-box;
  border:1px solid #ccc;
  border-radius:8px;
}
.history-item{
  padding:10px 0;
  border-bottom:1px solid #ddd;
}
small{
  color:#777;
}
</style>
</head>

<body>

<header>
<h1>💜 Lili Faucet</h1>
<p>Tvoj osobný crypto dashboard</p>
</header>

<div class="container">

<div class="card">
<h2>💰 Môj zostatok</h2>
<div class="balance" id="balance">0 satoshi</div>
<p>Testovací zostatok</p>
</div>

<div class="card">
<h2>🚀 Služby</h2>
<button onclick="testPTC()">▶️ PTC</button>
<button onclick="testOfferwall()">🧩 Offerwall</button>
<button onclick="testMinevo()">⛏️ Minevo</button>
<button onclick="claimFaucet()">🎁 Faucet</button>
</div>

<div class="card">
<h2>🎁 Faucet</h2>
<p>Testovacia faucet odmena.</p>
<button onclick="claimFaucet()">💜 Získať testovaciu odmenu</button>
<p id="message"></p>
</div>

<div class="card">
<h2>💳 Výber</h2>

<label>Mena</label>
<select id="currency">
<option>BTC</option>
<option>USDT</option>
<option>USDC</option>
</select>

<label>Suma</label>
<input id="amount" type="number" placeholder="Zadaj sumu">

<label>Adresa peňaženky</label>
<input id="wallet" type="text" placeholder="Zadaj adresu peňaženky">

<button onclick="withdraw()">📤 Požiadať o výber</button>

<p id="withdrawMessage"></p>
</div>

<div class="card">
<h2>📜 História</h2>
<div id="history">Zatiaľ žiadne záznamy.</div>
</div>

</div>

<script>

let balance = Number(localStorage.getItem("lili_balance")) || 0;

const balanceEl = document.getElementById("balance");
const historyEl = document.getElementById("history");
const messageEl = document.getElementById("message");
const withdrawMessageEl = document.getElementById("withdrawMessage");

function updateBalance(){
  balanceEl.textContent = balance + " satoshi";
  localStorage.setItem("lili_balance", balance);
}

function addHistory(text){
  const oldHistory = localStorage.getItem("lili_history") || "";
  const date = new Date().toLocaleString("sk-SK");

  const newEntry =
    '<div class="history-item">🎁 ' +
    text +
    '<br><small>' +
    date +
    '</small></div>';

  localStorage.setItem(
    "lili_history",
    newEntry + oldHistory
  );

  historyEl.innerHTML =
    newEntry + oldHistory;
}

function claimFaucet(){
  balance += 1;
  updateBalance();

  addHistory("Faucet odmena: +1 test satoshi");

  messageEl.textContent =
    "✅ Pridaný 1 testovací satoshi.";
}

function testPTC(){
  messageEl.textContent =
    "▶️ PTC je zatiaľ v testovacom režime.";
}

function testOfferwall(){
  messageEl.textContent =
    "🧩 Offerwall bude pripojený neskôr.";
}

function testMinevo(){
  messageEl.textContent =
    "⛏️ Minevo bude pripojené neskôr.";
}

function withdraw(){

  const amount =
    document.getElementById("amount").value;

  const wallet =
    document.getElementById("wallet").value;

  const currency =
    document.getElementById("currency").value;

  if(!amount || !wallet){
    withdrawMessageEl.textContent =
      "⚠️ Vyplň sumu aj adresu peňaženky.";
    return;
  }

  withdrawMessageEl.textContent =
    "✅ Testovacia žiadosť bola vytvorená.";

  addHistory(
    "Testovací výber: " +
    amount + " " + currency
  );
}

const savedHistory =
  localStorage.getItem("lili_history");

if(savedHistory){
  historyEl.innerHTML = savedHistory;
}updateBalance();

</script>

</body>
</html>
